    <!-- Google Analytics 4. GA4 enhanced measurement already tracks SPA route
         changes via history events, so no per-route call is needed here. -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-RC48CMQ05T"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());
      // Only the production hostnames report.
      //
      // This was a blocklist of localhost, which stopped local dev and the
      // prerender pass polluting analytics but nothing else. Cloudflare gives
      // every preview deploy its own *.pages.dev hostname, so a blocklist can
      // never keep up - and it did not: over the 28 days to 2026-08-02, GA4
      // recorded 5 sessions from onealgorithm-staging.pages.dev and 1 from a
      // Builder.io preview, against 39 real ones. Eleven percent of the traffic
      // in the property was not traffic.
      //
      // An allowlist inverts that: anything not listed here is silent by
      // default, including staging and previews that do not exist yet.
      //
      // www is listed because it currently serves the site directly (HTTP 200,
      // not a redirect) and its visitors are real. Once www 301s to the apex
      // domain it will never execute this, and the entry can be dropped.
      const ANALYTICS_HOSTS = ["onealgorithm.com", "www.onealgorithm.com"];
      if (ANALYTICS_HOSTS.includes(location.hostname)) {
        gtag("config", "G-RC48CMQ05T");
      }

      // The contact form calls window.trackFormSubmission() on success, guarded
      // by a typeof check. Nothing ever defined it, so the guard was always
      // false and the call did nothing - which is why GA4 has three key events
      // configured and has never recorded a single one. Every enquiry the site
      // has produced is unattributed.
      //
      // generate_lead is GA4's recommended event name for exactly this. It has
      // to be marked as a key event in GA4 before it counts as a conversion;
      // sending it is necessary but not sufficient.
      window.trackFormSubmission = function () {
        if (!ANALYTICS_HOSTS.includes(location.hostname)) return;
        gtag("event", "generate_lead", {
          form_id: "contact",
          page_location: location.href
        });
      };
    </script>

    <!-- Global runtime guards to avoid uncaught promise rejections from third-party scripts -->
    <script>
      // Prevent uncaught unhandledrejection errors from external 3rd-party scripts (e.g., analytics integrations)
      window.addEventListener("unhandledrejection", function (event) {
        try {
          const reason = event.reason;
          // Only a genuine 401 status is suppressed. This used to also match any
          // rejection whose text merely contained "401" anywhere - a timestamp, a
          // request id, an asset filename - so real application failures were
          // silently swallowed and never reached error reporting.
          if (reason && reason.response?.status === 401) {
            console.warn(
              "Suppressed unhandled rejection with 401 status from third-party script.",
              reason,
            );
            event.preventDefault && event.preventDefault();
            return;
          }
        } catch (e) {
          // ignore any parsing errors and allow default behavior
        }
      });

      // Generic window error handler for noisy embed scripts (keep lightweight)
      window.addEventListener("error", function (e) {
        try {
          if (
            e &&
            e.message &&
            e.message.indexOf &&
            e.message.indexOf("Request failed with status code 401") !== -1
          ) {
            console.warn(
              "Suppressed error: third-party request returned 401",
              e.message,
            );
            e.preventDefault && e.preventDefault();
          }
        } catch (err) {}
      });
    </script>

  <body>
    <!-- Skip to main content for accessibility -->
    <!-- Targets the real <main>, which Layout gives id="main-content" and
         tabindex="-1". Pointing at #root only scrolled the page: a plain div
         cannot take focus, so keyboard users were moved visually while their
         focus stayed back on the link. -->
    <a
      href="#main-content"
      class="skip-link"
      style="
        position: absolute;
        left: -9999px;
        z-index: 999;
        padding: 1rem;
        background: #000;
        color: #fff;
        text-decoration: none;
      "
      >Skip to main content</a
    >

    <!-- No role="main" here. Layout renders a real <main> inside this div, so
         declaring one on the container too put a main landmark inside another
         main landmark on every page, which is invalid and gives screen readers
         two competing "main content" targets. The inner <main> is the real one,
         and it carries the tabindex the skip link above needs. -->
    <div id="root"></div>

<!doctype html>
<html lang="en">
  <head>

    <!-- ⛔ No hand-written <link> to the stylesheet here (its name is hashed). Vite injects the
         stylesheet itself, WITH crossorigin; a second link without it is a
         different request mode, so the browser downloaded the same 124KB twice
         before first paint (measured 2026-08-25). The old "preload + onload"
         trick also never made the CSS non-blocking, because Vite's link was
         blocking regardless — it only bought the duplicate. -->

    <!-- Font preloads removed: the three .woff2 files they pointed at are saved
         HTML 404 pages, not fonts, so these were high-priority requests for
         content the browser then threw away. See the note in client/global.css -
         restore both together if the real font files are ever added. -->

    <!-- Essential Meta Tags -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Google Analytics 4. GA4 enhanced measurement already tracks SPA route
         changes via history events, so no per-route call is needed here. -->
    <!-- fetchpriority="low", NOT deferred to `load`: a deferred loader loses
         the whole session of anyone who leaves before load, and on a page that
         paints at ~5s on mobile that is not a corner case. Low priority keeps
         the request early — the session is still recorded — while letting
         the CSS, fonts and poster win the bandwidth race before first paint.
         184KB, and it was contending with everything. -->
    <!-- ⛔ The gtag script tag was here and loaded unconditionally. GA4 sets
         cookies, and under GDPR/ePrivacy those need consent BEFORE they are
         set, not disclosure afterwards. A privacy policy that describes the
         cookie does not make setting it lawful. It is now injected by
         oaConsent() below, only after the visitor accepts. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());
      // Only the production hostnames report.
      //
      // This was a blocklist of localhost, which stopped local dev and the
      // prerender pass polluting analytics but nothing else. Cloudflare gives
      // every preview deploy its own *.pages.dev hostname, so a blocklist can
      // never keep up - and it did not: over the 28 days to 2026-08-02, GA4
      // recorded 5 sessions from onealgorithm-staging.pages.dev and 1 from a
      // Builder.io preview, against 39 real ones. Eleven percent of the traffic
      // in the property was not traffic.
      //
      // An allowlist inverts that: anything not listed here is silent by
      // default, including staging and previews that do not exist yet.
      //
      // www is listed because it currently serves the site directly (HTTP 200,
      // not a redirect) and its visitors are real. Once www 301s to the apex
      // domain it will never execute this, and the entry can be dropped.
      const ANALYTICS_HOSTS = ["onealgorithm.com", "www.onealgorithm.com"];

      /* Consent gate. Deliberately small: one analytics tool, so one yes/no
         decision. No category toggles, no vendor list, no consent-management
         platform — none of that is required to be lawful here, and each piece
         is another thing to maintain and another second of load.

         What compliance actually needs, and all this does:
           - nothing that sets a cookie runs before a choice is made
           - refusing is exactly as easy as accepting (equal buttons, no dark
             pattern, no pre-selection)
           - the choice persists, and can be changed from /privacy
         Declining is remembered so the banner does not nag. */
      function oaLoadAnalytics() {
        if (!ANALYTICS_HOSTS.includes(location.hostname)) return;
        if (document.getElementById("ga-tag")) return;
        const s = document.createElement("script");
        s.id = "ga-tag";
        s.async = true;
        s.src = "https://www.googletagmanager.com/gtag/js?id=G-RC48CMQ05T";
        document.head.appendChild(s);
        gtag("config", "G-RC48CMQ05T");
      }

      window.oaSetConsent = function (granted) {
        try {
          localStorage.setItem("oa-consent", granted ? "granted" : "denied");
        } catch (e) {
          /* private mode: honour the click for this page view, remember nothing */
        }
        const el = document.getElementById("oa-consent");
        if (el) el.remove();
        if (granted) oaLoadAnalytics();
      };

      (function () {
        let choice = null;
        try {
          choice = localStorage.getItem("oa-consent");
        } catch (e) {}
        if (choice === "granted") return oaLoadAnalytics();
        if (choice === "denied") return;
        document.addEventListener("DOMContentLoaded", function () {
          const b = document.createElement("div");
          b.id = "oa-consent";
          b.setAttribute("role", "dialog");
          b.setAttribute("aria-label", "Cookies");
          b.style.cssText =
            "position:fixed;left:1rem;bottom:1rem;z-index:9999;max-width:24rem;" +
            "background:#04182b;color:#dbe4ee;border:1px solid rgba(255,166,52,.35);" +
            "border-radius:16px;padding:14px 16px;font:14px/1.5 system-ui,sans-serif;" +
            "box-shadow:0 10px 30px rgba(0,0,0,.35)";
          b.innerHTML =
            '<p style="margin:0 0 10px">We use Google Analytics to see which pages bring in work. ' +
            'Nothing is set unless you agree. <a href="/privacy" style="color:#ffa634">Privacy</a></p>' +
            '<div style="display:flex;gap:8px">' +
            '<button type="button" id="oa-yes" style="flex:1;cursor:pointer;border:0;border-radius:8px;padding:8px 12px;font:600 14px system-ui,sans-serif;background:#ffa634;color:#0d1b2a">Accept</button>' +
            '<button type="button" id="oa-no" style="flex:1;cursor:pointer;border:1px solid #9fb3c8;border-radius:8px;padding:8px 12px;font:600 14px system-ui,sans-serif;background:transparent;color:#dbe4ee">Decline</button>' +
            "</div>";
          document.body.appendChild(b);
          document
            .getElementById("oa-yes")
            .addEventListener("click", () => window.oaSetConsent(true));
          document
            .getElementById("oa-no")
            .addEventListener("click", () => window.oaSetConsent(false));
        });
      })();

      // The contact form calls window.trackFormSubmission() on success, guarded
      // by a typeof check. Nothing ever defined it, so the guard was always
      // false and the call did nothing - which is why GA4 has three key events
      // configured and has never recorded a single one. Every enquiry the site
      // has produced is unattributed.
      //
      // generate_lead is GA4's recommended event name for exactly this. It has
      // to be marked as a key event in GA4 before it counts as a conversion;
      // sending it is necessary but not sufficient.
      window.trackFormSubmission = function () {
        if (!ANALYTICS_HOSTS.includes(location.hostname)) return;
        gtag("event", "generate_lead", {
          method: "form",
          form_id: "contact",
          page_location: location.href
        });
      };

      // Phone and email clicks, added 2026-08-12.
      //
      // The stated goal of this business is "we want our phone ringing", and
      // until now a phone click was the one conversion the site could not see.
      // A form submission fired generate_lead; tapping the number on a mobile
      // fired nothing at all, so every call the website produced was
      // attributed to nowhere — the same blind spot the form had before
      // trackFormSubmission was defined.
      //
      // Deliberately the SAME event name as the form, separated by `method`.
      // A tapped phone number is a lead by any definition that matters here, so
      // it should sit in the same conversion count rather than a parallel one
      // nobody remembers to look at — while `method` still allows splitting
      // phone from email from form in a report.
      //
      // ⚠️ Sending the event is necessary but NOT sufficient: generate_lead has
      // to be marked as a key event in the GA4 admin before it counts as a
      // conversion. That is a setting in GA4, not something this file can do.
      //
      // No preventDefault and no delay. A tel: link must dial instantly; the
      // beacon transport survives the navigation on its own.
      window.trackContactClick = function (method) {
        if (!ANALYTICS_HOSTS.includes(location.hostname)) return;
        gtag("event", "generate_lead", {
          method: method,
          page_location: location.href,
          transport_type: "beacon"
        });
      };

      // Microsoft Clarity — heatmaps, session recordings, scroll depth and rage
      // clicks. Project y7nmhim5ql. Free with no sampling, and its Data Export
      // API is wired into the hub, so what this records is queryable.
      //
      // Reuses the SAME ANALYTICS_HOSTS allowlist as GA4 above rather than
      // declaring a second one: two lists is two things to forget to update,
      // and the reasoning for the allowlist is already written above it.
      //
      // ponytail: injected on `load`, not in the <head> as Microsoft's snippet
      // does. Mobile TBT here is already over the 200ms budget with GA4 alone,
      // and a head script would land in the same window. Ceiling: the first
      // moment of a session is not recorded. Acceptable because everything we
      // actually read from Clarity — scroll depth, rage clicks, dead clicks —
      // happens after the page is usable. Move it back to the head if session
      // start ever needs to be seen.
      if (ANALYTICS_HOSTS.includes(location.hostname)) {
        addEventListener("load", function () {
          (function (c, l, a, r, i, t, y) {
            c[a] =
              c[a] ||
              function () {
                (c[a].q = c[a].q || []).push(arguments);
              };
            t = l.createElement(r);
            t.async = 1;
            t.src = "https://www.clarity.ms/tag/" + i;
            y = l.getElementsByTagName(r)[0];
            y.parentNode.insertBefore(t, y);
          })(window, document, "clarity", "script", "y7nmhim5ql");
        });
      }
    </script>

    <!-- Preload the body face. It is self-hosted and on the critical path, but
         the browser cannot discover it until it has downloaded and parsed the
         CSS that declares the @font-face — so without this, first paint uses
         the fallback and then swaps, which is the flash of unstyled text.
         `crossorigin` is required on font preloads even for same-origin files:
         fonts are fetched in CORS mode, and omitting it makes the browser fetch
         the file a SECOND time rather than reuse the preloaded one. -->

    <!-- Global runtime guards to avoid uncaught promise rejections from third-party scripts -->
    <script>
      // Prevent uncaught unhandledrejection errors from external 3rd-party scripts (e.g., analytics integrations)
      window.addEventListener("unhandledrejection", function (event) {
        try {
          const reason = event.reason;
          // Only a genuine 401 status is suppressed. This used to also match any
          // rejection whose text merely contained "401" anywhere - a timestamp, a
          // request id, an asset filename - so real application failures were
          // silently swallowed and never reached error reporting.
          if (reason && reason.response?.status === 401) {
            console.warn(
              "Suppressed unhandled rejection with 401 status from third-party script.",
              reason,
            );
            event.preventDefault && event.preventDefault();
            return;
          }
        } catch (e) {
          // ignore any parsing errors and allow default behavior
        }
      });

      // Generic window error handler for noisy embed scripts (keep lightweight)
      window.addEventListener("error", function (e) {
        try {
          if (
            e &&
            e.message &&
            e.message.indexOf &&
            e.message.indexOf("Request failed with status code 401") !== -1
          ) {
            console.warn(
              "Suppressed error: third-party request returned 401",
              e.message,
            );
            e.preventDefault && e.preventDefault();
          }
        } catch (err) {}
      });
    </script>

  <body>
    <!-- Skip to main content for accessibility -->
    <!-- Targets the real <main>, which Layout gives id="main-content" and
         tabindex="-1". Pointing at #root only scrolled the page: a plain div
         cannot take focus, so keyboard users were moved visually while their
         focus stayed back on the link. -->
    <a
      href="#main-content"
      class="skip-link"
      style="
        position: absolute;
        left: -9999px;
        z-index: 999;
        padding: 1rem;
        background: #000;
        color: #fff;
        text-decoration: none;
      "
      >Skip to main content</a
    >

    <!-- No role="main" here. Layout renders a real <main> inside this div, so
         declaring one on the container too put a main landmark inside another
         main landmark on every page, which is invalid and gives screen readers
         two competing "main content" targets. The inner <main> is the real one,
         and it carries the tabindex the skip link above needs. -->
    <div id="root"></div>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Page not found — OneAlgorithm</title>
<!--
  This file exists to make missing pages return a real 404.

  Without it Cloudflare Pages falls back to the app shell and answers 200 for
  any path at all, so /wp-login.php, /.env, a mistyped link and a hallucinated
  URL were all valid pages as far as a crawler was concerned. Bing had crawled
  thousands of URLs against a sitemap of 28. The canonical tag kept the junk out
  of the index, but the crawl budget was spent regardless, and a soft 404 is a
  quality signal search engines act on.

  noindex is belt and braces: a 404 is already not indexed, but this page is
  static and could in principle be requested directly.
-->
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://onealgorithm.com/">
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    padding: 24px; background: #f6f7f9; color: #14161a;
    font: 16px/1.6 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .card {
    max-width: 520px; width: 100%; background: #fff; border: 1px solid #e5e7eb;
    border-radius: 14px; padding: 40px 36px; text-align: center;
  }
  .mark { font-size: .78rem; letter-spacing: .09em; text-transform: uppercase; color: #6b7280; }
  h1 { font-size: 1.6rem; margin: 14px 0 10px; letter-spacing: -.02em; }
  p { margin: 0 0 26px; color: #4b5563; }
  .links { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  a.btn {
    display: inline-block; padding: 10px 18px; border-radius: 8px;
    text-decoration: none; font-size: .92rem; font-weight: 600;
    background: #1d4ed8; color: #fff;
  }
  a.alt { background: #fff; color: #1f2937; border: 1px solid #d1d5db; }
  @media (prefers-color-scheme: dark) {
    body { background: #0d0f12; color: #f3f4f6; }
    .card { background: #16181d; border-color: #262a31; }
    p { color: #9ca3af; }
    a.alt { background: #16181d; color: #e5e7eb; border-color: #343a43; }
  }
</style>
</head>
<body>
  <main class="card">
    <div class="mark">OneAlgorithm</div>
    <h1>We couldn&rsquo;t find that page</h1>
    <p>The link may be out of date, or the address mistyped. Everything below still works.</p>
    <div class="links">
      <a class="btn" href="/">Home</a>
      <a class="btn alt" href="/services">Services</a>
      <a class="btn alt" href="/industries">Industries</a>
      <a class="btn alt" href="/contact">Contact us</a>
    </div>
  </main>
</body>
</html>

<text x="32" y="1414" font-size="26" fill="#35485c">Unsubscribes and Email Opt Out, both ways</text>
<text x="32" y="1458" font-size="20" font-family="JetBrains Mono, Consolas, Menlo, monospace" fill="#005eaa">TESTED IN BOTH DIRECTIONS</text>
<text x="56" y="76" font-size="20" font-family="JetBrains Mono, Consolas, Menlo, monospace" fill="#5a6b7d">SALES OR SERVICE CLOUD</text>
<text x="56" y="122" font-size="28" font-weight="600" fill="#0d1b2a">Your CRM records</text>
<text x="56" y="174.79999999999998" font-size="26" fill="#35485c">Contacts, Leads and Campaign</text>
<text x="56" y="211.2" font-size="26" fill="#35485c">Members, with the Email Opt Out</text>
<text x="56" y="247.6" font-size="26" fill="#35485c">field</text>
<text x="56" y="390" font-size="20" font-family="JetBrains Mono, Consolas, Menlo, monospace" fill="#5a6b7d">CONNECTOR</text>
<text x="56" y="436" font-size="28" font-weight="600" fill="#0d1b2a">Marketing Cloud Connect</text>
<text x="56" y="488.8" font-size="26" fill="#35485c">Syncs the objects and fields you</text>
<text x="56" y="525.2" font-size="26" fill="#35485c">choose, on a schedule</text>
<text x="56" y="668" font-size="20" font-family="JetBrains Mono, Consolas, Menlo, monospace" fill="#5a6b7d">CONTACT BUILDER</text>
<text x="56" y="714" font-size="28" font-weight="600" fill="#0d1b2a">Synchronized data extensions</text>
<text x="56" y="766.8000000000001" font-size="26" fill="#35485c">Your CRM data as Marketing Cloud</text>
<text x="56" y="803.2" font-size="26" fill="#35485c">sees it</text>
<text x="56" y="946" font-size="20" font-family="JetBrains Mono, Consolas, Menlo, monospace" fill="#5a6b7d">JOURNEY BUILDER · AUTOMATION STUDIO</text>
<text x="56" y="992" font-size="28" font-weight="600" fill="#0d1b2a">Audiences and timing</text>
<text x="56" y="1044.8000000000002" font-size="26" fill="#35485c">Who gets which message, and when</text>
<text x="56" y="1188" font-size="20" font-family="JetBrains Mono, Consolas, Menlo, monospace" fill="#5a6b7d">SENDS</text>
<text x="56" y="1234" font-size="28" font-weight="600" fill="#0d1b2a">Email and SMS</text>
<text x="56" y="1286.8" font-size="26" fill="#35485c">Sent to the audience, minus</text>
<text x="56" y="1323.2" font-size="26" fill="#35485c">anyone unsubscribed</text>
</svg>

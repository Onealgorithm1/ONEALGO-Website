<rect x="32" y="32" width="492" height="250" fill="#ffffff" stroke="#5a6b7d" stroke-width="1"/>
<rect x="32" y="346" width="492" height="214" fill="#ffffff" stroke="#5a6b7d" stroke-width="1"/>
<rect x="32" y="624" width="492" height="214" fill="#ffffff" stroke="#5a6b7d" stroke-width="1"/>
<rect x="32" y="902" width="492" height="178" fill="#ffffff" stroke="#5a6b7d" stroke-width="1"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1498" width="640" height="1498" role="img" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif">
<title>A typical Marketing Cloud Connect set-up</title>
<desc>Diagram of a typical Marketing Cloud Connect set-up: contacts, leads and campaign data sync from Salesforce into Marketing Cloud data extensions on a schedule and feed journeys and automations, while unsubscribes and opt-outs flow back so both systems agree on who must not be contacted.</desc>

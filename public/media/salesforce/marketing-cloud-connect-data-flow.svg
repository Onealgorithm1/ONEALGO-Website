<rect x="32" y="32" width="184" height="214" fill="#ffffff" stroke="#5a6b7d" stroke-width="1"/>
<rect x="254" y="32" width="184" height="214" fill="#ffffff" stroke="#5a6b7d" stroke-width="1"/>

<text x="124" y="328" font-size="16" fill="#35485c">Unsubscribes and Email Opt Out, both ways</text>
<text x="124" y="350" font-size="12" font-family="JetBrains Mono, Consolas, Menlo, monospace" fill="#005eaa">TESTED IN BOTH DIRECTIONS</text>
<text x="46" y="58" font-size="12" font-family="JetBrains Mono, Consolas, Menlo, monospace" fill="#5a6b7d">SALES OR SERVICE</text>
<text x="46" y="74.8" font-size="12" font-family="JetBrains Mono, Consolas, Menlo, monospace" fill="#5a6b7d">CLOUD</text>
<text x="46" y="102.6" font-size="17" font-weight="600" fill="#0d1b2a">Your CRM records</text>
<text x="46" y="135" font-size="16" fill="#35485c">Contacts, Leads</text>
<text x="46" y="157.4" font-size="16" fill="#35485c">and Campaign</text>
<text x="46" y="179.8" font-size="16" fill="#35485c">Members, with the</text>
<text x="46" y="202.20000000000002" font-size="16" fill="#35485c">Email Opt Out</text>
<text x="46" y="224.60000000000002" font-size="16" fill="#35485c">field</text>
<text x="268" y="58" font-size="12" font-family="JetBrains Mono, Consolas, Menlo, monospace" fill="#5a6b7d">CONNECTOR</text>
<text x="268" y="85.8" font-size="17" font-weight="600" fill="#0d1b2a">Marketing Cloud</text>
<text x="268" y="109.6" font-size="17" font-weight="600" fill="#0d1b2a">Connect</text>
<text x="268" y="142" font-size="16" fill="#35485c">Syncs the objects</text>
<text x="268" y="164.4" font-size="16" fill="#35485c">and fields you</text>
<text x="268" y="186.8" font-size="16" fill="#35485c">choose, on a</text>
<text x="268" y="209.20000000000002" font-size="16" fill="#35485c">schedule</text>
<text x="490" y="58" font-size="12" font-family="JetBrains Mono, Consolas, Menlo, monospace" fill="#5a6b7d">CONTACT BUILDER</text>
<text x="490" y="85.8" font-size="17" font-weight="600" fill="#0d1b2a">Synchronized data</text>
<text x="490" y="109.6" font-size="17" font-weight="600" fill="#0d1b2a">extensions</text>
<text x="490" y="142" font-size="16" fill="#35485c">Your CRM data as</text>
<text x="490" y="164.4" font-size="16" fill="#35485c">Marketing Cloud</text>
<text x="490" y="186.8" font-size="16" fill="#35485c">sees it</text>
<text x="712" y="58" font-size="12" font-family="JetBrains Mono, Consolas, Menlo, monospace" fill="#5a6b7d">JOURNEY BUILDER ·</text>
<text x="712" y="74.8" font-size="12" font-family="JetBrains Mono, Consolas, Menlo, monospace" fill="#5a6b7d">AUTOMATION STUDIO</text>
<text x="712" y="102.6" font-size="17" font-weight="600" fill="#0d1b2a">Audiences and</text>
<text x="712" y="126.39999999999999" font-size="17" font-weight="600" fill="#0d1b2a">timing</text>
<text x="712" y="158.79999999999998" font-size="16" fill="#35485c">Who gets which</text>
<text x="712" y="181.2" font-size="16" fill="#35485c">message, and when</text>
<text x="934" y="58" font-size="12" font-family="JetBrains Mono, Consolas, Menlo, monospace" fill="#5a6b7d">SENDS</text>
<text x="934" y="85.8" font-size="17" font-weight="600" fill="#0d1b2a">Email and SMS</text>
<text x="934" y="118.19999999999999" font-size="16" fill="#35485c">Sent to the</text>
<text x="934" y="140.6" font-size="16" fill="#35485c">audience, minus</text>
<text x="934" y="163" font-size="16" fill="#35485c">anyone</text>
<text x="934" y="185.4" font-size="16" fill="#35485c">unsubscribed</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1136 604" width="1136" height="604" role="img" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif">
<title>How a change moves under Salesforce managed services</title>
<desc>Diagram of how a change is handled under Salesforce managed services: your admin keeps day-to-day user requests, and each change we take is built in a sandbox, tested, deployed and written down with what changed and why, with a release check before each of Salesforce’s three yearly releases.</desc>

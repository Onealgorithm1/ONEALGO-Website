<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1484" width="640" height="1484" role="img" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif">
<title>How a Salesforce implementation runs</title>
<desc>Diagram of a Salesforce implementation in four stages: before you buy licenses, configuration and build, data migration and integration, and after go-live. A branch shows that any single stage can be taken on its own.</desc>
<rect width="640" height="1484" fill="#ffffff"/>
<path d="M56 336 L56 384" fill="none" stroke="#005eaa" stroke-width="3" stroke-linecap="square"/>
<path d="M56 688 L56 736" fill="none" stroke="#005eaa" stroke-width="3" stroke-linecap="square"/>
<path d="M56 1040 L56 1088" fill="none" stroke="#005eaa" stroke-width="3" stroke-linecap="square"/>
<path d="M552 888 L604 888 L604 1432" fill="none" stroke="#005eaa" stroke-width="3" stroke-linecap="square" stroke-dasharray="10 8"/>
<rect x="32" y="32" width="520" height="304" fill="#ffffff" stroke="#5a6b7d" stroke-width="1"/>
<rect x="32" y="384" width="520" height="304" fill="#ffffff" stroke="#5a6b7d" stroke-width="1"/>
<rect x="32" y="736" width="520" height="304" fill="#ffffff" stroke="#5a6b7d" stroke-width="1"/>
<rect x="32" y="1088" width="520" height="304" fill="#ffffff" stroke="#5a6b7d" stroke-width="1"/>
<text x="604" y="1468" font-size="26" text-anchor="end" fill="#35485c">Take any stage on its own</text>
<text x="56" y="76" font-size="20" font-family="JetBrains Mono, Consolas, Menlo, monospace" fill="#5a6b7d">01</text>
<text x="56" y="122" font-size="28" font-weight="600" fill="#0d1b2a">Before you buy licenses</text>
<text x="56" y="178.7" font-size="26" fill="#35485c">A license count and a rough cost,</text>
<text x="56" y="215.1" font-size="26" fill="#35485c">before anyone signs</text>
<text x="56" y="264.5" font-size="26" fill="#35485c">Which clouds and edition you need</text>
<text x="56" y="300.9" font-size="26" fill="#35485c">— and which you don’t</text>
<text x="56" y="428" font-size="20" font-family="JetBrains Mono, Consolas, Menlo, monospace" fill="#5a6b7d">02</text>
<text x="56" y="474" font-size="28" font-weight="600" fill="#0d1b2a">Configuration and build</text>
<text x="56" y="530.7" font-size="26" fill="#35485c">Sales Cloud and Service Cloud</text>
<text x="56" y="567.1" font-size="26" fill="#35485c">configuration</text>
<text x="56" y="616.5" font-size="26" fill="#35485c">Flow automation for the manual</text>
<text x="56" y="652.9" font-size="26" fill="#35485c">steps</text>
<text x="56" y="780" font-size="20" font-family="JetBrains Mono, Consolas, Menlo, monospace" fill="#5a6b7d">03</text>
<text x="56" y="826" font-size="28" font-weight="600" fill="#0d1b2a">Data migration and integration</text>
<text x="56" y="882.7" font-size="26" fill="#35485c">Load, then reconcile record counts</text>
<text x="56" y="919.1" font-size="26" fill="#35485c">and totals</text>
<text x="56" y="968.5" font-size="26" fill="#35485c">ERP-to-Salesforce syncs, SAP</text>
<text x="56" y="1004.9" font-size="26" fill="#35485c">included, so both sides agree</text>
<text x="56" y="1132" font-size="20" font-family="JetBrains Mono, Consolas, Menlo, monospace" fill="#5a6b7d">04</text>
<text x="56" y="1178" font-size="28" font-weight="600" fill="#0d1b2a">After go-live</text>
<text x="56" y="1234.7" font-size="26" fill="#35485c">Release-window testing before</text>
<text x="56" y="1271.1000000000001" font-size="26" fill="#35485c">every Salesforce upgrade</text>
<text x="56" y="1320.5000000000002" font-size="26" fill="#35485c">Reports and dashboards changed as</text>
<text x="56" y="1356.9000000000003" font-size="26" fill="#35485c">the questions change</text>
</svg>

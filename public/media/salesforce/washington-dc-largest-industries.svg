  <line x1="32" y1="68" x2="768" y2="68" stroke="#e3e9f0"/>
  <text x="284" y="118" text-anchor="end" font-size="17" fill="#35485c">Professional services</text>
  <rect x="300" y="100" width="400" height="28" rx="2" fill="#005eaa"/>
  <text x="710" y="120" font-size="17" font-weight="600" fill="#0d1b2a">633,277</text>
  <text x="284" y="174" text-anchor="end" font-size="17" fill="#35485c">Health care and social assistance</text>
  <rect x="300" y="156" width="231" height="28" rx="2" fill="#4f86b8"/>
  <text x="541" y="176" font-size="17" font-weight="600" fill="#0d1b2a">365,086</text>
  <text x="284" y="230" text-anchor="end" font-size="17" fill="#35485c">Nonprofit &amp; civic orgs</text>
  <rect x="300" y="212" width="90" height="28" rx="2" fill="#4f86b8"/>
  <text x="400" y="232" font-size="17" font-weight="600" fill="#0d1b2a">142,394</text>
  <text x="284" y="286" text-anchor="end" font-size="17" fill="#35485c">Information</text>
  <rect x="300" y="268" width="81" height="28" rx="2" fill="#4f86b8"/>
  <text x="391" y="288" font-size="17" font-weight="600" fill="#0d1b2a">127,928</text>
  <text x="32" y="356" font-size="14" fill="#5a6b7d">Source: US Census Bureau, County Business Patterns 2023. OneAlgorithm.</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" height="380" role="img" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif">
  <title>Largest employer groups, Washington, DC metro (employees)</title>
  <rect width="800" height="380" fill="#ffffff"/>

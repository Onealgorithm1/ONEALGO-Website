<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1136 616" width="1136" height="616" role="img" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif">
<title>Four ways to connect a system to Salesforce</title>
<desc>Diagram of four ways to connect a system to Salesforce: Salesforce Connect shows external data without copying it, Platform Events and Change Data Capture announce changes for another system to pick up, the Bulk API runs large scheduled loads, and middleware such as MuleSoft or SAP Integration Suite adds a separately licensed runtime. Each route is drawn with the moving parts it adds.</desc>

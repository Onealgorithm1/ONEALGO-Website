<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 639" width="640" height="639" role="img" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif">
<title>Salesforce retirements: Workflow Rules, Process Builder and Optimizer</title>
<desc>Timeline: Salesforce ended support for Workflow Rules and Process Builder on December 31, 2025, and retired Optimizer for Hyperforce orgs in the Winter '26 release and for all other orgs in Summer '26.</desc>

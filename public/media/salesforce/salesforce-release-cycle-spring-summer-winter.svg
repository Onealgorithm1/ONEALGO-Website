<text x="280" y="186" font-size="12" font-family="JetBrains Mono, Consolas, Menlo, monospace" text-anchor="middle" fill="#5a6b7d">EACH RELEASE</text>
<text x="280" y="226" font-size="16" text-anchor="middle" fill="#35485c">1. Release notes read</text>
<text x="280" y="246" font-size="16" text-anchor="middle" fill="#35485c">against your org</text>
<text x="280" y="278" font-size="16" text-anchor="middle" fill="#35485c">2. Tested in a sandbox</text>
<text x="280" y="298" font-size="16" text-anchor="middle" fill="#35485c">preview</text>
<text x="280" y="330" font-size="16" text-anchor="middle" fill="#35485c">3. Reaches production</text>
<text x="206" y="89.5" font-size="17" font-weight="600" fill="#0d1b2a">Spring</text>
<text x="206" y="114.3" font-size="12" font-family="JetBrains Mono, Consolas, Menlo, monospace" fill="#5a6b7d">TYPICALLY FEBRUARY</text>
<text x="375.7" y="383.5" font-size="17" font-weight="600" fill="#0d1b2a">Summer</text>
<text x="375.7" y="408.3" font-size="12" font-family="JetBrains Mono, Consolas, Menlo, monospace" fill="#5a6b7d">TYPICALLY JUNE</text>
<text x="36.3" y="383.5" font-size="17" font-weight="600" fill="#0d1b2a">Winter</text>
<text x="36.3" y="408.3" font-size="12" font-family="JetBrains Mono, Consolas, Menlo, monospace" fill="#5a6b7d">TYPICALLY OCTOBER</text>
</svg>

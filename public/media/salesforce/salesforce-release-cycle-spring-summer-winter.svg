<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 516" width="560" height="516" role="img" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif">
<title>Salesforce’s three releases a year</title>
<desc>Diagram of Salesforce’s three releases a year, Spring, Summer and Winter, typically in February, June and October, each read against your org and tested in a sandbox before it reaches production.</desc>

<path d="M300 396 L300 440" fill="none" stroke="#005eaa" stroke-width="3" stroke-linecap="square"/>
<path d="M300 568 L300 612" fill="none" stroke="#005eaa" stroke-width="3" stroke-linecap="square"/>
<path d="M300 740 L300 784" fill="none" stroke="#005eaa" stroke-width="3" stroke-linecap="square"/>
<path d="M300 912 L300 956" fill="none" stroke="#005eaa" stroke-width="3" stroke-linecap="square"/>
<path d="M560 1020 L624 1020 L624 332 L560 332" fill="none" stroke="#005eaa" stroke-width="3" stroke-linecap="square" stroke-dasharray="10 8"/>
<path d="M40 1268.5 L16 1268.5 L16 676 L40 676" fill="none" stroke="#005eaa" stroke-width="3" stroke-linecap="square" stroke-dasharray="10 8"/>
<rect x="40" y="56" width="520" height="128" fill="#ffffff" stroke="#5a6b7d" stroke-width="1"/>
<rect x="40" y="268" width="520" height="128" fill="#ffffff" stroke="#5a6b7d" stroke-width="1"/>

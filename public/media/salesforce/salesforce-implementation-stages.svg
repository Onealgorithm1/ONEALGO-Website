<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1136 381" width="1136" height="381" role="img" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif">
<title>How a Salesforce implementation runs</title>
<desc>Diagram of a Salesforce implementation in four stages: before you buy licenses, configuration and build, data migration and integration, and after go-live. A branch shows that any single stage can be taken on its own.</desc>
<rect width="1136" height="381" fill="#ffffff"/>
<path d="M262 64 L313 64" fill="none" stroke="#7d8da0" stroke-width="1.5" stroke-linecap="square"/>
<path d="M543 64 L593 64" fill="none" stroke="#7d8da0" stroke-width="1.5" stroke-linecap="square"/>
<path d="M823 64 L874 64" fill="none" stroke="#7d8da0" stroke-width="1.5" stroke-linecap="square"/>
<path d="M708 297 L708 341 L736 341" fill="none" stroke="#7d8da0" stroke-width="1.5" stroke-linecap="square" stroke-dasharray="6 5"/>
<rect x="32" y="40" width="230" height="257" fill="#ffffff" stroke="#5a6b7d" stroke-width="1"/>
<rect x="313" y="40" width="230" height="257" fill="#ffffff" stroke="#5a6b7d" stroke-width="1"/>
<rect x="593" y="40" width="230" height="257" fill="#ffffff" stroke="#5a6b7d" stroke-width="1"/>
<rect x="874" y="40" width="230" height="257" fill="#ffffff" stroke="#5a6b7d" stroke-width="1"/>
<text x="748" y="346.5" font-size="16" fill="#35485c">Take any stage on its own</text>
<text x="48" y="68" font-size="12" font-family="JetBrains Mono, Consolas, Menlo, monospace" fill="#5a6b7d">01</text>
<text x="48" y="95.8" font-size="17" font-weight="600" fill="#0d1b2a">Before you buy</text>
<text x="48" y="119.6" font-size="17" font-weight="600" fill="#0d1b2a">licenses</text>
<text x="48" y="154.39999999999998" font-size="16" fill="#35485c">A license count and a</text>
<text x="48" y="176.79999999999998" font-size="16" fill="#35485c">rough cost, before</text>
<text x="48" y="199.2" font-size="16" fill="#35485c">anyone signs</text>
<text x="48" y="229.6" font-size="16" fill="#35485c">Which clouds and</text>
<text x="48" y="252" font-size="16" fill="#35485c">edition you need — and</text>
<text x="48" y="274.4" font-size="16" fill="#35485c">which you don’t</text>
<text x="329" y="68" font-size="12" font-family="JetBrains Mono, Consolas, Menlo, monospace" fill="#5a6b7d">02</text>
<text x="329" y="95.8" font-size="17" font-weight="600" fill="#0d1b2a">Configuration and</text>
<text x="329" y="119.6" font-size="17" font-weight="600" fill="#0d1b2a">build</text>
<text x="329" y="154.39999999999998" font-size="16" fill="#35485c">Sales Cloud and Service</text>
<text x="329" y="176.79999999999998" font-size="16" fill="#35485c">Cloud configuration</text>
<text x="329" y="207.2" font-size="16" fill="#35485c">Flow automation for the</text>
<text x="329" y="229.6" font-size="16" fill="#35485c">manual steps</text>
<text x="609" y="68" font-size="12" font-family="JetBrains Mono, Consolas, Menlo, monospace" fill="#5a6b7d">03</text>
<text x="609" y="95.8" font-size="17" font-weight="600" fill="#0d1b2a">Data migration and</text>
<text x="609" y="119.6" font-size="17" font-weight="600" fill="#0d1b2a">integration</text>
<text x="609" y="154.39999999999998" font-size="16" fill="#35485c">Load, then reconcile</text>
<text x="609" y="176.79999999999998" font-size="16" fill="#35485c">record counts and</text>
<text x="609" y="199.2" font-size="16" fill="#35485c">totals</text>
<text x="609" y="229.6" font-size="16" fill="#35485c">ERP-to-Salesforce</text>
<text x="609" y="252" font-size="16" fill="#35485c">syncs, SAP included, so</text>
<text x="609" y="274.4" font-size="16" fill="#35485c">both sides agree</text>
<text x="890" y="68" font-size="12" font-family="JetBrains Mono, Consolas, Menlo, monospace" fill="#5a6b7d">04</text>
<text x="890" y="95.8" font-size="17" font-weight="600" fill="#0d1b2a">After go-live</text>
<text x="890" y="130.6" font-size="16" fill="#35485c">Release-window testing</text>
<text x="890" y="153" font-size="16" fill="#35485c">before every Salesforce</text>
<text x="890" y="175.4" font-size="16" fill="#35485c">upgrade</text>
<text x="890" y="205.8" font-size="16" fill="#35485c">Reports and dashboards</text>
<text x="890" y="228.20000000000002" font-size="16" fill="#35485c">changed as the</text>
<text x="890" y="250.60000000000002" font-size="16" fill="#35485c">questions change</text>
</svg>

<desc>Diagram of the Salesforce community around Atlanta: 4 Trailblazer Community Groups within 50 km (Salesforce Admin Group, Atlanta; Salesforce Architect Group, Atlanta; Salesforce Developer Group, Alpharetta; Salesforce Women in Tech Group, Atlanta). Salesforce office: 950 East Paces Ferry Road NE, Suite 3300, Atlanta, GA 30326. OneAlgorithm is in Malvern, Pennsylvania, and runs the work remotely, inside your Salesforce org.</desc>

<text x="554" y="92" font-size="17" font-weight="600" fill="#0d1b2a">Another</text>
<text x="554" y="115.8" font-size="17" font-weight="600" fill="#0d1b2a">Salesforce org</text>
<text x="554" y="145" font-size="16" fill="#35485c">After a merger,</text>
<text x="554" y="167.4" font-size="16" fill="#35485c">or a second</text>
<text x="554" y="189.8" font-size="16" fill="#35485c">business unit</text>
<text x="559" y="55" font-size="12" font-family="JetBrains Mono, Consolas, Menlo, monospace" fill="#5a6b7d">EXTERNAL IDS</text>
<text x="38" y="286" font-size="17" font-weight="600" fill="#0d1b2a">Field map</text>
<text x="38" y="315.2" font-size="16" fill="#35485c">Objects, owners, picklist values and external IDs, agreed before any load</text>
<text x="36" y="408" font-size="16" font-weight="600" fill="#0d1b2a">Accounts</text>
<text x="174" y="408" font-size="16" font-weight="600" fill="#0d1b2a">Contacts</text>
<text x="311" y="408" font-size="16" font-weight="600" fill="#0d1b2a">Opportunities</text>
<text x="449" y="408" font-size="16" font-weight="600" fill="#0d1b2a">Custom</text>
<text x="449" y="430.4" font-size="16" font-weight="600" fill="#0d1b2a">objects</text>
<text x="586" y="408" font-size="16" font-weight="600" fill="#0d1b2a">Files</text>
<text x="38" y="524" font-size="17" font-weight="600" fill="#0d1b2a">Reconciled object by object</text>
<text x="38" y="553.1999999999999" font-size="16" fill="#35485c">Source count = Salesforce count, before go-live</text>

<text x="38" y="92" font-size="17" font-weight="600" fill="#0d1b2a">No-code</text>
<text x="38" y="115.8" font-size="17" font-weight="600" fill="#0d1b2a">platforms</text>
<text x="38" y="145" font-size="16" fill="#35485c">QuickBase and</text>
<text x="38" y="167.4" font-size="16" fill="#35485c">Kissflow</text>
<text x="43" y="55" font-size="12" font-family="JetBrains Mono, Consolas, Menlo, monospace" fill="#005eaa">DELIVERED</text>
<text x="210" y="92" font-size="17" font-weight="600" fill="#0d1b2a">Another CRM</text>
<text x="210" y="121.2" font-size="16" fill="#35485c">HubSpot, Zoho,</text>
<text x="210" y="143.6" font-size="16" fill="#35485c">Dynamics 365</text>

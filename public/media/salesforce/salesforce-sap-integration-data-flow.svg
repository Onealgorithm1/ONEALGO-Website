<title>A typical SAP-to-Salesforce sync</title>
<desc>Diagram: a typical SAP-to-Salesforce sync, with customer, product and price records moving from SAP into Salesforce on a schedule, sales orders created in SAP from won deals with status sent back, invoice status shown read-only, and failed records written to a log a named person reviews.</desc>
